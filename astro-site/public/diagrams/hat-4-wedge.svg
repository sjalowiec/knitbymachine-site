<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Hat body -->
  <path d="M 150 300 L 150 150 Q 150 120, 180 110 L 320 110 Q 350 120, 350 150 L 350 300 Z" 
        fill="#f3f4f6" stroke="#52682D" stroke-width="2"/>
  
  <!-- Wedge dividing lines -->
  <line x1="200" y1="110" x2="200" y2="180" stroke="#52682D" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="250" y1="110" x2="250" y2="180" stroke="#52682D" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="110" x2="300" y2="180" stroke="#52682D" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Wedge number labels -->
  <circle cx="175" cy="135" r="12" fill="#52682D"/>
  <text x="175" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="white">1</text>
  
  <circle cx="225" cy="135" r="12" fill="#52682D"/>
  <text x="225" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="white">2</text>
  
  <circle cx="275" cy="135" r="12" fill="#52682D"/>
  <text x="275" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="white">3</text>
  
  <circle cx="325" cy="135" r="12" fill="#52682D"/>
  <text x="325" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="white">4</text>
  
  <!-- Brim section -->
  <rect x="150" y="280" width="200" height="20" fill="#e5e7eb" stroke="#52682D" stroke-width="2"/>
  
  <!-- Crown shaping line -->
  <line x1="150" y1="180" x2="350" y2="180" stroke="#52682D" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Width dimension -->
  <line x1="150" y1="330" x2="350" y2="330" stroke="#52682D" stroke-width="1.5"/>
  <circle cx="150" cy="330" r="4" fill="#52682D"/>
  <circle cx="350" cy="330" r="4" fill="#52682D"/>
  <text x="250" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#52682D">
    Width: {{WIDTH}}
  </text>
  <!-- Cast-on stitches (secondary, smaller) -->
  <text x="250" y="365" text-anchor="middle" font-size="11" fill="#52682D">
    {{CAST_ON_STS}}
  </text>
  
  <!-- Height dimension (left side) -->
  <line x1="120" y1="110" x2="120" y2="300" stroke="#52682D" stroke-width="1.5"/>
  <circle cx="120" cy="110" r="4" fill="#52682D"/>
  <circle cx="120" cy="300" r="4" fill="#52682D"/>
  <!-- Height label rotated 90 degrees, positioned between line and hat -->
  <text x="135" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#52682D" transform="rotate(-90, 135, 205)">
    Height: {{HEIGHT}}
  </text>
  
  <!-- Crown dimension (left side, from top to crown start) -->
  <line x1="100" y1="110" x2="100" y2="180" stroke="#52682D" stroke-width="1.5"/>
  <circle cx="100" cy="110" r="3" fill="#52682D"/>
  <circle cx="100" cy="180" r="3" fill="#52682D"/>
  <text x="60" y="140" text-anchor="end" font-size="11" font-weight="600" fill="#52682D">
    Crown
  </text>
  <text x="60" y="153" text-anchor="end" font-size="10" fill="#52682D">
    {{CROWN_ROWS}}
  </text>
  
  <!-- Body dimension (left side, between crown start and brim) -->
  <line x1="100" y1="180" x2="100" y2="280" stroke="#52682D" stroke-width="1.5"/>
  <circle cx="100" cy="280" r="3" fill="#52682D"/>
  <text x="60" y="225" text-anchor="end" font-size="11" font-weight="600" fill="#52682D">
    Body
  </text>
  <!-- Body rows (secondary, smaller) -->
  <text x="60" y="238" text-anchor="end" font-size="10" fill="#52682D">
    {{BODY_ROWS}}
  </text>
  
  <!-- Brim depth (left side) -->
  <line x1="100" y1="280" x2="100" y2="300" stroke="#52682D" stroke-width="1.5"/>
  <circle cx="100" cy="300" r="3" fill="#52682D"/>
  <text x="60" y="293" text-anchor="end" font-size="11" font-weight="600" fill="#52682D">
    Brim: {{BRIM_DEPTH}}
  </text>
  <!-- Brim rows (secondary, smaller) -->
  <text x="60" y="306" text-anchor="end" font-size="10" fill="#52682D">
    {{BRIM_ROWS}}
  </text>
  
  <!-- Section labels -->
  <text x="250" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">
    Body
  </text>
  <text x="250" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">
    Brim
  </text>
</svg>
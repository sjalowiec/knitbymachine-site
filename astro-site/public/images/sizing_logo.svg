<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .st0 { fill: none; stroke: #52682d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .st1 { fill: #52682d; }
    </style>
  </defs>
  
  <!-- Measuring tape circle -->
  <circle cx="48" cy="48" r="40" class="st0"/>
  
  <!-- Ruler markings -->
  <line x1="30" y1="48" x2="66" y2="48" class="st0"/>
  <line x1="30" y1="44" x2="30" y2="52" class="st0"/>
  <line x1="38" y1="46" x2="38" y2="50" class="st0"/>
  <line x1="48" y1="44" x2="48" y2="52" class="st0"/>
  <line x1="58" y1="46" x2="58" y2="50" class="st0"/>
  <line x1="66" y1="44" x2="66" y2="52" class="st0"/>
  
  <!-- Numbers -->
  <text x="28" y="38" font-family="Poppins, sans-serif" font-size="8" font-weight="600" fill="#52682d" text-anchor="middle">0</text>
  <text x="48" y="38" font-family="Poppins, sans-serif" font-size="8" font-weight="600" fill="#52682d" text-anchor="middle">5</text>
  <text x="68" y="38" font-family="Poppins, sans-serif" font-size="8" font-weight="600" fill="#52682d" text-anchor="middle">10</text>
  
  <!-- Diagonal measurement line -->
  <line x1="35" y1="58" x2="61" y2="32" class="st0"/>
  <circle cx="35" cy="58" r="2" class="st1"/>
  <circle cx="61" cy="32" r="2" class="st1"/>
</svg>
